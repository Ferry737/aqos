<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="AQOS architecture: data to signal to risk gate to execution to settlement to notification, over a Postgres system of record">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="1" stop-color="#110d24"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff5d7a"/></marker>
  </defs>
  <style>
    .sans{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
    .mono{font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:6 7;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-26}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="1200" height="600" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="598" rx="17" fill="none" stroke="#9b7bff" stroke-opacity=".22"/>
  <text x="40" y="50" class="sans" font-size="22" font-weight="700" fill="#efeaff">Six layers, one safe path</text>
  <text x="40" y="76" class="mono" font-size="13" fill="#8b88a6">data → signal → risk gate → execution → settlement → notification</text>

  <!-- main flow -->
  <g class="sans" text-anchor="middle">
    <g transform="translate(40 120)"><rect width="168" height="150" rx="14" fill="#15122a" stroke="#6fd3ff" stroke-opacity=".5"/>
      <text x="84" y="32" font-size="12" fill="#6fd3ff" class="mono" letter-spacing="1.5">LAYER 1</text>
      <text x="84" y="62" font-size="18" font-weight="650" fill="#fff">Data ingestion</text>
      <text x="84" y="88" font-size="12.5" fill="#b9b6d6">CEX · funding · news</text><text x="84" y="106" font-size="12.5" fill="#b9b6d6">feed quarantine</text>
      <text x="84" y="132" font-size="12" fill="#6fd3ff" class="mono">WF-01 · WF-02</text></g>
    <g transform="translate(236 120)"><rect width="168" height="150" rx="14" fill="#15122a" stroke="#9b7bff" stroke-opacity=".6"/>
      <text x="84" y="32" font-size="12" fill="#9b7bff" class="mono" letter-spacing="1.5">LAYER 2 · 5</text>
      <text x="84" y="62" font-size="18" font-weight="650" fill="#fff">Signal</text>
      <text x="84" y="88" font-size="12.5" fill="#b9b6d6">GBM · LSTM · Transformer</text><text x="84" y="106" font-size="12.5" fill="#b9b6d6">portfolio proposals</text>
      <text x="84" y="132" font-size="12" fill="#9b7bff" class="mono">WF-03 · WF-08</text></g>
    <g transform="translate(432 100)"><rect width="196" height="190" rx="16" fill="#241024" stroke="#ff5d7a" stroke-width="2"/>
      <text x="98" y="32" font-size="12" fill="#ff8fa3" class="mono" letter-spacing="1.5">LAYER 4 · THE GATE</text>
      <text x="98" y="64" font-size="20" font-weight="700" fill="#fff">Risk gate</text>
      <text x="98" y="90" font-size="12.5" fill="#f3c6d0">deterministic · fail-closed</text>
      <text x="98" y="108" font-size="12.5" fill="#f3c6d0">modes · limits · caps</text><text x="98" y="126" font-size="12.5" fill="#f3c6d0">stale data · pairs</text>
      <rect x="22" y="142" width="152" height="30" rx="15" fill="#ff5d7a" fill-opacity=".18" stroke="#ff5d7a"/>
      <text x="98" y="162" font-size="12" fill="#ffd0d9" class="mono">no token, no order</text></g>
    <g transform="translate(656 120)"><rect width="168" height="150" rx="14" fill="#15122a" stroke="#ffb454" stroke-opacity=".55"/>
      <text x="84" y="32" font-size="12" fill="#ffb454" class="mono" letter-spacing="1.5">LAYER 3</text>
      <text x="84" y="62" font-size="18" font-weight="650" fill="#fff">Execution</text>
      <text x="84" y="88" font-size="12.5" fill="#b9b6d6">TWAP · IS · passive</text><text x="84" y="106" font-size="12.5" fill="#b9b6d6">EMS circuit breaker</text>
      <text x="84" y="132" font-size="12" fill="#ffb454" class="mono">WF-05 · EMS</text></g>
    <g transform="translate(852 120)"><rect width="148" height="150" rx="14" fill="#15122a" stroke="#3ddc97" stroke-opacity=".5"/>
      <text x="74" y="32" font-size="12" fill="#3ddc97" class="mono" letter-spacing="1.5">LAYER 3</text>
      <text x="74" y="62" font-size="18" font-weight="650" fill="#fff">Settlement</text>
      <text x="74" y="88" font-size="12.5" fill="#b9b6d6">fills · positions</text><text x="74" y="106" font-size="12.5" fill="#b9b6d6">reconciliation</text>
      <text x="74" y="132" font-size="12" fill="#3ddc97" class="mono">WF-06</text></g>
    <g transform="translate(1028 120)"><rect width="132" height="150" rx="14" fill="#15122a" stroke="#c9b8ff" stroke-opacity=".5"/>
      <text x="66" y="32" font-size="12" fill="#c9b8ff" class="mono" letter-spacing="1.5">LAYER 6</text>
      <text x="66" y="62" font-size="18" font-weight="650" fill="#fff">Notify</text>
      <text x="66" y="88" font-size="12.5" fill="#b9b6d6">chat · on-call</text><text x="66" y="106" font-size="12.5" fill="#b9b6d6">client reports</text>
      <text x="66" y="132" font-size="12" fill="#c9b8ff" class="mono">WF-12 · WF-16</text></g>
  </g>
  <g fill="none" stroke="#9b7bff" stroke-width="2.2" marker-end="url(#arr)" class="flow">
    <path d="M208 195H234"/><path d="M404 195H430"/><path d="M628 195H654"/><path d="M824 195H850"/><path d="M1000 195H1026"/>
  </g>

  <!-- feedback: risk monitor + kill switch -->
  <g class="sans">
    <rect x="432" y="326" width="392" height="86" rx="14" fill="#1a0f1e" stroke="#ff5d7a" stroke-opacity=".55" stroke-dasharray="5 5"/>
    <text x="628" y="354" text-anchor="middle" font-size="12" fill="#ff8fa3" class="mono" letter-spacing="1.5">CONTINUOUS · EVERY 15 s</text>
    <text x="628" y="380" text-anchor="middle" font-size="16" font-weight="650" fill="#fff">Risk monitor → breaker ladder → kill switch</text>
    <text x="628" y="400" text-anchor="middle" font-size="12.5" fill="#f3c6d0">reduce-only · halt · cancel-all · flatten · two-person reset</text>
  </g>
  <path d="M628 326V292" stroke="#ff5d7a" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" class="flow"/>
  <path d="M628 326V292" stroke="none"/>

  <!-- supervisor -->
  <g class="sans">
    <rect x="40" y="326" width="364" height="86" rx="14" fill="#101a1c" stroke="#3ddc97" stroke-opacity=".45" stroke-dasharray="5 5"/>
    <text x="222" y="354" text-anchor="middle" font-size="12" fill="#3ddc97" class="mono" letter-spacing="1.5">24/7 AUTONOMY</text>
    <text x="222" y="380" text-anchor="middle" font-size="16" font-weight="650" fill="#fff">Supervisor · error handler · failover</text>
    <text x="222" y="400" text-anchor="middle" font-size="12.5" fill="#bfe9d6">data-quality flag · dead-man switch · fencing leases</text>
  </g>
  <g class="sans">
    <rect x="852" y="326" width="308" height="86" rx="14" fill="#15122a" stroke="#9b7bff" stroke-opacity=".4" stroke-dasharray="5 5"/>
    <text x="1006" y="354" text-anchor="middle" font-size="12" fill="#9b7bff" class="mono" letter-spacing="1.5">AI AGENTS · NEVER ON THE ORDER PATH</text>
    <text x="1006" y="380" text-anchor="middle" font-size="16" font-weight="650" fill="#fff">Claude Opus 5.5 agents</text>
    <text x="1006" y="400" text-anchor="middle" font-size="12.5" fill="#cfc8f5">triage · research · analyst · reports</text>
  </g>

  <!-- system of record -->
  <g class="sans">
    <rect x="40" y="446" width="1120" height="118" rx="16" fill="#0e1424" stroke="#6fd3ff" stroke-opacity=".5"/>
    <text x="600" y="478" text-anchor="middle" font-size="12" fill="#6fd3ff" class="mono" letter-spacing="1.8">POSTGRES · SYSTEM OF RECORD · SAFETY INVARIANTS LIVE HERE</text>
    <g font-size="13.5" fill="#dff3ff" text-anchor="middle">
      <rect x="64" y="496" width="248" height="46" rx="10" fill="#6fd3ff" fill-opacity=".08" stroke="#6fd3ff" stroke-opacity=".35"/><text x="188" y="524">single-use, expiring risk tokens</text>
      <rect x="326" y="496" width="248" height="46" rx="10" fill="#6fd3ff" fill-opacity=".08" stroke="#6fd3ff" stroke-opacity=".35"/><text x="450" y="524">escalate-only modes · two-person reset</text>
      <rect x="588" y="496" width="248" height="46" rx="10" fill="#6fd3ff" fill-opacity=".08" stroke="#6fd3ff" stroke-opacity=".35"/><text x="712" y="524">hash-chained audit log</text>
      <rect x="850" y="496" width="286" height="46" rx="10" fill="#6fd3ff" fill-opacity=".08" stroke="#6fd3ff" stroke-opacity=".35"/><text x="993" y="524">venue is truth · reconcile every 5 min</text>
    </g>
  </g>
</svg>
