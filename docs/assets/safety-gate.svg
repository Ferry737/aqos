<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="How a trade idea becomes an order: only through the risk gate and a single-use token">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="1" stop-color="#110d24"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9b7bff"/></marker>
    <marker id="no" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff5d7a"/></marker>
  </defs>
  <style>
    .sans{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:6 7;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-26}}
    .tok{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 10px #3ddc97)}}
    @media (prefers-reduced-motion:reduce){.flow,.tok{animation:none}}
  </style>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#9b7bff" stroke-opacity=".22"/>
  <text x="40" y="50" class="sans" font-size="22" font-weight="700" fill="#efeaff">No token, no order</text>
  <text x="40" y="76" class="mono" font-size="13" fill="#8b88a6">the database, not the workflow, decides whether an order may exist</text>

  <g class="sans" text-anchor="middle">
    <g transform="translate(40 110)"><rect width="190" height="104" rx="14" fill="#17132b" stroke="#9b7bff" stroke-opacity=".55"/>
      <text x="95" y="36" font-size="12" class="mono" fill="#9b7bff" letter-spacing="1.5">TRADE IDEA</text><text x="95" y="64" font-size="17" font-weight="650" fill="#fff">Proposal</text><text x="95" y="86" font-size="12.5" fill="#cbbcff">from models or rebalance</text></g>
    <g transform="translate(272 100)"><rect width="250" height="124" rx="16" fill="#241024" stroke="#ff5d7a" stroke-width="2"/>
      <text x="125" y="34" font-size="12" class="mono" fill="#ff8fa3" letter-spacing="1.5">RISK GATE</text><text x="125" y="62" font-size="18" font-weight="700" fill="#fff">Deterministic checks</text>
      <text x="125" y="86" font-size="12.5" fill="#f3c6d0">mode · limits · stale data · collar</text><text x="125" y="106" font-size="12.5" fill="#f3c6d0">batch exposure · pairs · capacity</text></g>
    <g class="tok" transform="translate(564 100)"><rect width="250" height="124" rx="16" fill="#0f2019" stroke="#3ddc97" stroke-width="2"/>
      <text x="125" y="34" font-size="12" class="mono" fill="#3ddc97" letter-spacing="1.5">POSTGRES</text><text x="125" y="62" font-size="18" font-weight="700" fill="#fff">Risk token</text>
      <text x="125" y="86" font-size="12.5" fill="#bfe9d6">single-use · expires in 90 s</text><text x="125" y="106" font-size="12.5" fill="#bfe9d6">approved size can only shrink</text></g>
    <g transform="translate(856 110)"><rect width="304" height="104" rx="14" fill="#231a0f" stroke="#ffb454" stroke-opacity=".6"/>
      <text x="152" y="36" font-size="12" class="mono" fill="#ffb454" letter-spacing="1.5">ORDER</text><text x="152" y="64" font-size="17" font-weight="650" fill="#fff">Registered, then sent to the EMS</text><text x="152" y="86" font-size="12.5" fill="#f0d29b">idempotent on the token's id</text></g>
  </g>
  <g fill="none" stroke="#9b7bff" stroke-width="2.2" marker-end="url(#arr)" class="flow">
    <path d="M230 162H270"/><path d="M522 162H562"/><path d="M814 162H854"/>
  </g>

  <!-- refusals -->
  <g class="sans">
    <path d="M397 224V268" stroke="#ff5d7a" stroke-width="2" fill="none" marker-end="url(#no)"/>
    <rect x="272" y="270" width="250" height="40" rx="10" fill="#ff5d7a" fill-opacity=".1" stroke="#ff5d7a" stroke-opacity=".6"/>
    <text x="397" y="295" text-anchor="middle" font-size="13" fill="#ffd0d9">reject, with the reason recorded</text>
    <path d="M689 224V268" stroke="#ff5d7a" stroke-width="2" fill="none" marker-end="url(#no)"/>
    <rect x="564" y="270" width="250" height="40" rx="10" fill="#ff5d7a" fill-opacity=".1" stroke="#ff5d7a" stroke-opacity=".6"/>
    <text x="689" y="295" text-anchor="middle" font-size="13" fill="#ffd0d9">expired, reused or mismatched: refused</text>
  </g>
  <g class="sans">
    <rect x="856" y="270" width="304" height="40" rx="10" fill="#9b7bff" fill-opacity=".1" stroke="#9b7bff" stroke-opacity=".5"/>
    <text x="1008" y="295" text-anchor="middle" font-size="13" fill="#e0d8ff">no LLM anywhere on this path</text>
    <text x="40" y="345" font-size="12.5" fill="#8b88a6" class="mono">in-flight orders count as exposure · a send that times out is SEND_UNCONFIRMED, never blindly retried · all of it is tested in db/ and tools/tests/</text>
  </g>
</svg>
