<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Map of the 17 n8n workflows grouped by layer">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="1" stop-color="#110d24"/></linearGradient></defs>
  <style>
    .sans{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
    .chip{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}}
    @media (prefers-reduced-motion:reduce){.chip{animation:none}}
  </style>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="468" rx="17" fill="none" stroke="#9b7bff" stroke-opacity=".22"/>
  <text x="40" y="50" class="sans" font-size="22" font-weight="700" fill="#efeaff">17 n8n workflows, 285 nodes</text>
  <text x="40" y="76" class="mono" font-size="13" fill="#8b88a6">generated from code, validated against the real n8n 2.41.4 node catalog</text>

  <g class="sans">
    <!-- row 1 -->
    <g transform="translate(40 108)"><g class="chip"><rect width="268" height="64" rx="12" fill="#101a1c" stroke="#3ddc97" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#3ddc97">WF-00</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Supervisor</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#9ad8bd">every 30 s</text></g></g>
    <g transform="translate(324 108)"><g class="chip" style="animation-delay:.05s"><rect width="268" height="64" rx="12" fill="#0f1a24" stroke="#6fd3ff" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#6fd3ff">WF-01</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Event gateway</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#9fd9f2">HMAC webhook</text></g></g>
    <g transform="translate(608 108)"><g class="chip" style="animation-delay:.1s"><rect width="268" height="64" rx="12" fill="#0f1a24" stroke="#6fd3ff" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#6fd3ff">WF-02</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Alternative data</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#9fd9f2">funding · news</text></g></g>
    <g transform="translate(892 108)"><g class="chip" style="animation-delay:.15s"><rect width="268" height="64" rx="12" fill="#17132b" stroke="#9b7bff" stroke-opacity=".55"/><text x="16" y="26" font-size="12" class="mono" fill="#9b7bff">WF-03</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Signal cycle</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#cbbcff">every 5 min bar</text></g></g>
    <!-- row 2 -->
    <g transform="translate(40 188)"><g class="chip" style="animation-delay:.2s"><rect width="268" height="64" rx="12" fill="#241024" stroke="#ff5d7a" stroke-opacity=".7"/><text x="16" y="26" font-size="12" class="mono" fill="#ff8fa3">WF-04</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Risk gate</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#f3c6d0">the only door</text></g></g>
    <g transform="translate(324 188)"><g class="chip" style="animation-delay:.25s"><rect width="268" height="64" rx="12" fill="#231a0f" stroke="#ffb454" stroke-opacity=".55"/><text x="16" y="26" font-size="12" class="mono" fill="#ffb454">WF-05</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Execution dispatch</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#f0d29b">EMS breaker</text></g></g>
    <g transform="translate(608 188)"><g class="chip" style="animation-delay:.3s"><rect width="268" height="64" rx="12" fill="#231a0f" stroke="#ffb454" stroke-opacity=".55"/><text x="16" y="26" font-size="12" class="mono" fill="#ffb454">WF-06</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Settlement</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#f0d29b">venue is truth</text></g></g>
    <g transform="translate(892 188)"><g class="chip" style="animation-delay:.35s"><rect width="268" height="64" rx="12" fill="#241024" stroke="#ff5d7a" stroke-opacity=".7"/><text x="16" y="26" font-size="12" class="mono" fill="#ff8fa3">WF-07</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Risk monitor</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#f3c6d0">every 15 s</text></g></g>
    <!-- row 3 -->
    <g transform="translate(40 268)"><g class="chip" style="animation-delay:.4s"><rect width="268" height="64" rx="12" fill="#17132b" stroke="#9b7bff" stroke-opacity=".55"/><text x="16" y="26" font-size="12" class="mono" fill="#9b7bff">WF-08</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Portfolio agent</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#cbbcff">bounded autonomy</text></g></g>
    <g transform="translate(324 268)"><g class="chip" style="animation-delay:.45s"><rect width="268" height="64" rx="12" fill="#17132b" stroke="#9b7bff" stroke-opacity=".55"/><text x="16" y="26" font-size="12" class="mono" fill="#9b7bff">WF-09</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Research agent</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#cbbcff">daily</text></g></g>
    <g transform="translate(608 268)"><g class="chip" style="animation-delay:.5s"><rect width="268" height="64" rx="12" fill="#1a1328" stroke="#c9b8ff" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#c9b8ff">WF-10</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Client onboarding</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#ddd2ff">paper first</text></g></g>
    <g transform="translate(892 268)"><g class="chip" style="animation-delay:.55s"><rect width="268" height="64" rx="12" fill="#1a1328" stroke="#c9b8ff" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#c9b8ff">WF-11</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Billing sync</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#ddd2ff">never liquidates</text></g></g>
    <!-- row 4 -->
    <g transform="translate(40 348)"><g class="chip" style="animation-delay:.6s"><rect width="268" height="64" rx="12" fill="#1a1328" stroke="#c9b8ff" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#c9b8ff">WF-12</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Client reports</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#ddd2ff">compliance gate</text></g></g>
    <g transform="translate(324 348)"><g class="chip" style="animation-delay:.65s"><rect width="268" height="64" rx="12" fill="#101a1c" stroke="#3ddc97" stroke-opacity=".5"/><text x="16" y="26" font-size="12" class="mono" fill="#3ddc97">WF-13</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Error handler</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#9ad8bd">fails safe</text></g></g>
    <g transform="translate(608 348)"><g class="chip" style="animation-delay:.7s"><rect width="268" height="64" rx="12" fill="#241024" stroke="#ff5d7a" stroke-opacity=".7"/><text x="16" y="26" font-size="12" class="mono" fill="#ff8fa3">WF-14</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Kill switch</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#f3c6d0">two-person reset</text></g></g>
    <g transform="translate(892 348)"><g class="chip" style="animation-delay:.75s"><rect width="268" height="64" rx="12" fill="#241024" stroke="#ff5d7a" stroke-opacity=".7"/><text x="16" y="26" font-size="12" class="mono" fill="#ff8fa3">WF-15</text><text x="16" y="48" font-size="16" font-weight="650" fill="#fff">Risk analyst agent</text><text x="252" y="48" text-anchor="end" font-size="12" fill="#f3c6d0">tighten only</text></g></g>
    <!-- row 5 -->
    <g transform="translate(40 428)"><g class="chip" style="animation-delay:.8s"><text x="0" y="14" font-size="12.5" fill="#8b88a6" class="mono">WF-16 Notifier ties them together: chat for everything, on-call page for SEV1</text></g></g>
  </g>
</svg>
